apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# includeSelectors: false — selectors are declared explicitly in each workload
# so adding a label here can never mutate an immutable selector on a live object.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: otsitohub-api
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/part-of: otsitohub-platform
      app.kubernetes.io/component: backend

commonAnnotations:
  amsi.dev/team: otsitohub
  amsi.dev/repository: https://gitea-teotl.amsiops.io/AmSiDev/otsitohub-api

# Secrets are provisioned manually with kubectl and are NOT in git.
# See ../README.md for the exact commands.
resources:
  - namespace.yaml
  - postgres-statefulset.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: otsitohub-api-config
    literals:
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173
