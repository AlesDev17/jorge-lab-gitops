apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otsitohub-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AlesDev17/jorge-lab-gitops.git
    targetRevision: main
    path: apps/otsitohub-api/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: otsitohub
  syncPolicy:
    # Automated sync is the point of the lab: a push to main lands in the
    # cluster. Drop this block to go back to manual "Sync" from the UI.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
